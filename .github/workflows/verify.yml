name: Verify independent plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node scripts/package-check.mjs
      - name: Three engines, Chinese, SyncTeX and offline rebuild
        run: npm run integration
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: latex-studio-${{ matrix.os }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS
